[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "one_step_fm_based_vla"
version = "0.2.0"
description = "one_step_fm_based_vla V15 matched CUDA training and LIBERO evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "diffusers>=0.30,<1",
  "numpy>=1.26,<2",
  "Pillow>=10",
  "timm>=1.0",
  "torch>=2.3",
  "torchvision>=0.18",
  "tqdm>=4.66",
  "transformers>=4.56,<5",
]

[project.optional-dependencies]
libero = [
  "bddl",
  "cloudpickle",
  "easydict",
  "gym",
  "h5py>=3.10",
  "imageio[ffmpeg]>=2.34",
  "robosuite==1.4.1",
  "tensorflow>=2.20",
  "tensorflow-datasets>=4.9",
]
dev = [
  "pytest>=8",
  "ruff>=0.2.2",
]

[project.scripts]
one_step_fm_based_vla-train = "turbovla.training.train_mixed:main"
one_step_fm_based_vla-eval = "turbovla.evaluation.runner:main"

[tool.setuptools.packages.find]
where = [".", "third_party/vla_adapter"]
include = ["experiments*", "turbovla*", "vla_adapter*"]

[tool.setuptools.package-data]
"experiments.libero" = ["configs/*.json"]
"turbovla._vendor.myvla" = ["README.md"]
"turbovla.evaluation" = ["nvidia_egl_vendor.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
